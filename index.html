<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API & Sorgu Paneli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Share Tech Mono', monospace;
    background-color: #050000;
    background-image: 
      linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 80px; /* Alt menü için boşluk */
  }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  
  .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 15px; }
  .header h1 { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-size: 22px; letter-spacing: 2px; }

  /* SEKMELER */
  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ALT MENÜ (Bottom Nav) */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: #0a0000; border-top: 1px solid #ff3333;
    display: flex; justify-content: space-around;
    padding: 12px 0; z-index: 100;
    box-shadow: 0 -5px 20px rgba(255,0,0,0.2);
  }
  .nav-btn {
    background: none; border: none; color: #888;
    font-family: inherit; font-size: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: all 0.3s;
  }
  .nav-btn.active { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-weight: bold; }
  .nav-icon { font-size: 20px; }

  /* SORGU EKRANI TASARIMI */
  .query-box { background: rgba(10, 0, 0, 0.8); border: 1px solid rgba(255,0,0,0.3); padding: 20px; margin-bottom: 20px; }
  .query-box label { display: block; color: #ff5555; font-size: 13px; margin-bottom: 5px; }
  .query-box select, .query-box input {
    width: 100%; padding: 12px; background: rgba(255, 0, 0, 0.05);
    border: 1px solid rgba(255, 0, 0, 0.3); color: #fff;
    font-family: inherit; outline: none; margin-bottom: 15px;
  }
  .query-box select:focus, .query-box input:focus { border-color: #ff0000; background: rgba(255, 0, 0, 0.1); }
  .btn-query { width: 100%; padding: 12px; background: #ff3333; color: #fff; border: none; font-family: inherit; font-size: 16px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
  .btn-query:hover { background: #ff0000; box-shadow: 0 0 15px #ff0000; }

  .result-box {
    background: #000; border: 1px solid #ff3333; padding: 20px;
    color: #00ff88; font-size: 14px; white-space: pre-wrap; display: none; border-radius: 5px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
  }
  .result-box.show { display: block; }
  .res-title { color: #ffaa00; font-weight: bold; }
  .res-key { color: #4fc3f7; }
  .res-val { color: #00ff88; }

  /* API KARTLARI TASARIMI */
  .api-card {
    background: rgba(10, 0, 0, 0.8); border: 1px solid rgba(255, 0, 0, 0.3);
    border-left: 5px solid #ff0000; padding: 20px; margin-bottom: 15px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .api-card:hover { box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); background: rgba(20, 0, 0, 0.9); }
  .api-info h2 { font-size: 18px; margin-bottom: 8px; }
  .api-info .code-snippet { background: rgba(255, 0, 0, 0.1); color: #ff5555; padding: 5px 10px; font-size: 12px; border: 1px solid rgba(255, 0, 0, 0.3); display: inline-block; word-break: break-all; }
  .btn-start { background: transparent; color: #ff3333; border: 1px solid #ff3333; padding: 10px 20px; font-family: inherit; cursor: pointer; text-transform: uppercase; }
  .btn-start:hover { background: #ff3333; color: #000; box-shadow: 0 0 15px #ff3333; }

  /* MODAL */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;}
  .modal-overlay.active { display: flex; }
  .modal { background: #0a0000; border: 1px solid #ff3333; width: 100%; max-width: 500px; padding: 25px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); position: relative; }
  .modal h3 { color: #ff3333; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 10px; }
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; color: #ff5555; font-size: 12px; margin-bottom: 5px; }
  .input-group input { width: 100%; padding: 10px; background: rgba(255, 0, 0, 0.05); border: 1px solid rgba(255, 0, 0, 0.3); color: #fff; font-family: inherit; outline: none; }
  .generated-url { background: #000; border: 1px dashed #ff3333; padding: 15px; margin: 20px 0; color: #00ff88; font-size: 13px; word-break: break-all; display: none; }
  .generated-url.show { display: block; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 12px; font-family: inherit; cursor: pointer; border: none; font-weight: bold; }
  .btn-generate { background: #ff3333; color: #fff; }
  .btn-copy { background: transparent; color: #00ff88; border: 1px solid #00ff88; }
  .btn-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3333; font-size: 20px; cursor: pointer; }

  @media (max-width: 600px) {
    .api-card { flex-direction: column; align-items: flex-start; gap: 15px; }
    .btn-start { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>/// SİSTEM PANELİ ///</h1>
  </div>

  <!-- 1. SEKME: SORGU MENÜSÜ -->
  <div id="tab-sorgu" class="tab-content active">
    <div class="query-box">
      <label>Sorgu Tipi Seç</label>
      <select id="queryEndpoint"></select>
      
      <div id="queryFields"></div>
      
      <button class="btn-query" onclick="doQuery()">SORGULA</button>
    </div>

    <div class="result-box" id="resultBox"></div>
  </div>

  <!-- 2. SEKME: API KATALOĞU -->
  <div id="tab-api" class="tab-content">
    <div id="apiList"></div>
  </div>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('sorgu')" id="btn-sorgu">
    <span class="nav-icon">🔍</span> Sorgu Menüsü
  </button>
  <button class="nav-btn" onclick="switchTab('api')" id="btn-api">
    <span class="nav-icon">🔗</span> API Kataloğu
  </button>
</div>

<!-- MODAL (API LİNK OLUŞTURMA) -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="btn-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">API Linki</h3>
    <div id="modalInputs"></div>
    <div class="generated-url" id="generatedUrl"></div>
    <div class="modal-actions">
      <button class="btn-generate" onclick="generateUrl()">LİNKİ OLUŞTUR</button>
      <button class="btn-copy" id="copyBtn" onclick="copyUrl()" style="display:none;">KOPYALA</button>
    </div>
  </div>
</div>

<script>
// TÜM API TANIMLARI (Hem sorgu hem API kataloğu için ortak)
const API_DEFS = {
  log:      { title: 'URL Log Çekme', params: [{k: 'url', l: 'Log Çekilecek URL', ph: 'https://...'}] },
  adsoyad:  { title: 'Ad Soyad Sorgu', params: [{k: 'ad', l: 'Ad', ph: 'Ahmet'}, {k: 'soyad', l: 'Soyad', ph: 'Yılmaz'}, {k: 'il', l: 'İl (Opsiyonel)', ph: 'Ankara'}, {k: 'ilce', l: 'İlçe (Opsiyonel)', ph: 'Çankaya'}] },
  adililce: { title: 'Ad İl İlçe Sorgu', params: [{k: 'ad', l: 'Ad', ph: 'Ahmet'}, {k: 'il', l: 'İl', ph: 'Ankara'}, {k: 'ilce', l: 'İlçe', ph: 'Çankaya'}] },
  tc:       { title: 'TC Kimlik Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  tcgsm:    { title: 'TC -> GSM Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  gsmtc:    { title: 'GSM -> TC Sorgu', params: [{k: 'gsm', l: 'GSM No', ph: '5xx...'}] },
  ailepro:  { title: 'Aile Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  vesika:   { title: 'Vesika Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  isyeri:   { title: 'İş Yeri Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  sgk:      { title: 'SGK Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  adres:    { title: 'Adres Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] }
};

const domain = window.location.origin;

// SONUÇ KUTUSU İÇİN ALAN EŞLEŞTİRMESİ
const FIELD_MAP = {
  YAKINLIK: 'YAKINLIK DURUMU', TC: 'TC', ADI: 'ADI', SOYADI: 'SOYADI', GSM: 'GSM',
  BABAADI: 'BABA ADI', BABATC: 'BABA TC', ANNEADI: 'ANNE ADI', ANNETC: 'ANNE TC',
  DOGUMTARIHI: 'DOĞUM TARİHİ', OLUMTARIHI: 'ÖLÜM TARİHİ', DOGUMYERI: 'DOĞUM YERİ',
  MEMLEKETIL: 'MEMLEKET İL', MEMLEKETILCE: 'MEMLEKET İLÇE', MEMLEKETKOY: 'MEMLEKET KÖY',
  ADRESIL: 'ADRES İL', ADRESILCE: 'ADRES İLÇE', AILESIRANO: 'AİLE SIRA NO',
  BIREYSIRANO: 'BİREY SIRA NO', MEDENIHAL: 'MEDENİ HAL', CINSIYET: 'CİNSİYET',
};

// --- SEKME GEÇİŞİ ---
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('btn-' + tab).classList.add('active');
}

// --- SORGU MENÜSÜ MANTIĞI ---
const queryEndpoint = document.getElementById('queryEndpoint');
const queryFields = document.getElementById('queryFields');
const resultBox = document.getElementById('resultBox');

// Dropdown'u doldur
for (const [key, def] of Object.entries(API_DEFS)) {
  let opt = document.createElement('option');
  opt.value = key;
  opt.innerText = def.title;
  queryEndpoint.appendChild(opt);
}

// Form alanlarını çiz
function renderQueryFields() {
  queryFields.innerHTML = '';
  let def = API_DEFS[queryEndpoint.value];
  def.params.forEach(p => {
    queryFields.innerHTML += `
      <div class="input-group">
        <label>${p.l}</label>
        <input type="text" id="q_${p.k}" placeholder="${p.ph}">
      </div>
    `;
  });
  resultBox.classList.remove('show');
}

queryEndpoint.addEventListener('change', renderQueryFields);
renderQueryFields(); // İlk açılışta çiz

// Sorguyu Çalıştır
async function doQuery() {
  let def = API_DEFS[queryEndpoint.value];
  let params = new URLSearchParams();
  
  for (let p of def.params) {
    let val = document.getElementById(`q_${p.k}`).value.trim();
    if (val) params.set(p.k, val); // Boş olanları es geç (Ad soyad il/ilçe opsiyonel)
  }

  if (params.toString() === '') {
    alert("Lütfen en az bir alan doldurun!");
    return;
  }

  resultBox.innerHTML = "Sorgulanıyor...";
  resultBox.classList.add('show');

  try {
    let res = await fetch(`/api/${queryEndpoint.value}?${params.toString()}`);
    let data = await res.json();
    renderResult(data);
  } catch (e) {
    resultBox.innerHTML = `<span style="color:#ff5555;">Hata oluştu: ${e.message}</span>`;
  }
}

// Sonucu Kutu Formatında Bas
function renderResult(data) {
  let records = [];
  if (Array.isArray(data.veri)) records = data.veri;
  else if (data.veri && typeof data.veri === 'object') records = [data.veri];
  else if (typeof data === 'object' && data !== null) records = [data];

  records = records.filter(r => r && typeof r === 'object');

  if (!records.length) {
    resultBox.innerHTML = '<span style="color:#ff5555;">Sonuç bulunamadı veya hata döndü.</span>';
    return;
  }

  let html = '';
  records.forEach((rec, idx) => {
    if (idx > 0) html += '\n';
    html += `<span class="res-title">╭━━━━━━━ Gozlerin ━━━━━━━</span>\n`;
    for (const [k, label] of Object.entries(FIELD_MAP)) {
      if (rec[k] !== undefined && rec[k] !== null && rec[k] !== '') {
        html += `┃➥ <span class="res-key">${label}:</span> <span class="res-val">${esc(String(rec[k]))}</span>\n`;
      }
    }
    // Eşleşmeyen diğer alanlar
    for (const [k, v] of Object.entries(rec)) {
      if (!FIELD_MAP[k] && v !== undefined && v !== null && v !== '' && k !== 'auth' && k !== 'auth_alt') {
        html += `┃➥ <span class="res-key">${k}:</span> <span class="res-val">${esc(String(v))}</span>\n`;
      }
    }
    html += `<span class="res-title">╰━━━━━━━ Gozlerin ━━━━━━━</span>`;
  });

  resultBox.innerHTML = html;
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


// --- API KATALOĞU MANTIĞI ---
const apiListEl = document.getElementById('apiList');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalInputs = document.getElementById('modalInputs');
const generatedUrlEl = document.getElementById('generatedUrl');
const copyBtn = document.getElementById('copyBtn');
let currentApi = null;

// Listeyi Ekrana Bas
for (const [key, def] of Object.entries(API_DEFS)) {
  const card = document.createElement('div');
  card.className = 'api-card';
  card.innerHTML = `
    <div class="api-info">
      <h2>${def.title}</h2>
      <div class="code-snippet">/api/${key}?${def.params.map(p => p.k + '=...').join('&')}</div>
    </div>
    <button class="btn-start" onclick="openModal('${key}')">BAŞLAT</button>
  `;
  apiListEl.appendChild(card);
}

function openModal(id) {
  currentApi = id;
  let def = API_DEFS[id];
  modalTitle.innerText = def.title;
  modalInputs.innerHTML = '';
  generatedUrlEl.classList.remove('show');
  copyBtn.style.display = 'none';

  def.params.forEach(p => {
    modalInputs.innerHTML += `
      <div class="input-group">
        <label>${p.l}</label>
        <input type="text" id="api_${p.k}" placeholder="${p.ph}">
      </div>
    `;
  });
  modal.classList.add('active');
}

function closeModal() { modal.classList.remove('active'); }

function generateUrl() {
  let def = API_DEFS[currentApi];
  let queryParts = [];
  
  for (let p of def.params) {
    let val = document.getElementById(`api_${p.k}`).value.trim();
    if (val) queryParts.push(`${p.k}=${encodeURIComponent(val)}`);
  }

  if (queryParts.length === 0) { alert("En az bir alan doldurun!"); return; }

  const finalUrl = `${domain}/api/${currentApi}?${queryParts.join('&')}`;
  generatedUrlEl.innerText = finalUrl;
  generatedUrlEl.classList.add('show');
  copyBtn.style.display = 'block';
}

function copyUrl() {
  navigator.clipboard.writeText(generatedUrlEl.innerText).then(() => {
    copyBtn.innerText = "KOPYALANDI ✔";
    setTimeout(() => copyBtn.innerText = "KOPYALA", 2000);
  });
}
</script>
</body>
</html>
