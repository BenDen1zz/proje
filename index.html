<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gözlerin API & Sorgu Paneli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Share Tech Mono', monospace;
    background-color: #050000;
    background-image: 
      linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  
  .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 15px; }
  .header h1 { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-size: 22px; letter-spacing: 2px; }

  /* SEKMELER */
  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ALT MENÜ */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; width: 100%;
    background: #0a0000; border-top: 1px solid #ff3333;
    display: flex; justify-content: space-around;
    padding: 12px 0; z-index: 100;
    box-shadow: 0 -5px 20px rgba(255,0,0,0.2);
  }
  .nav-btn {
    background: none; border: none; color: #888;
    font-family: inherit; font-size: 15px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: all 0.3s;
  }
  .nav-btn.active { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-weight: bold; }
  .nav-icon { font-size: 20px; }

  /* SORGU EKRANI */
  .query-box { background: rgba(10, 0, 0, 0.8); border: 1px solid rgba(255,0,0,0.3); padding: 20px; margin-bottom: 20px; }
  .query-box label { display: block; color: #ff5555; font-size: 13px; margin-bottom: 5px; }
  .query-box select, .query-box input {
    width: 100%; padding: 12px; background: rgba(255, 0, 0, 0.05);
    border: 1px solid rgba(255, 0, 0, 0.3); color: #fff;
    font-family: inherit; outline: none; margin-bottom: 15px;
  }
  .query-box select:focus, .query-box input:focus { border-color: #ff0000; background: rgba(255, 0, 0, 0.1); }
  .btn-query { width: 100%; padding: 12px; background: #ff3333; color: #fff; border: none; font-family: inherit; font-size: 16px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
  .btn-query:hover:not(:disabled) { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
  .btn-query:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-box {
    background: #000; border: 1px solid #ff3333; padding: 20px;
    color: #00ff88; font-size: 14px; white-space: pre-wrap; display: none; border-radius: 5px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); overflow-x: auto;
  }
  .result-box.show { display: block; }
  .res-title { color: #ffaa00; font-weight: bold; }
  .res-key { color: #4fc3f7; }
  .res-val { color: #00ff88; }
  .res-err { color: #ff3333; }

  /* API KATALOĞU */
  .api-card {
    background: rgba(10, 0, 0, 0.8); border: 1px solid rgba(255, 0, 0, 0.3);
    border-left: 5px solid #ff0000; padding: 20px; margin-bottom: 15px;
  }
  .api-card:hover { box-shadow: 0 0 15px rgba(255, 0, 0, 0.2); background: rgba(20, 0, 0, 0.9); }
  .api-card h2 { font-size: 18px; margin-bottom: 15px; color: #ff3333; }
  
  .api-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
  .api-inputs input {
    width: 100%; padding: 10px; background: rgba(255, 0, 0, 0.05);
    border: 1px solid rgba(255, 0, 0, 0.3); color: #fff; font-family: inherit; outline: none;
  }
  .api-inputs input:focus { border-color: #ff0000; }
  
  .btn-copy-api { 
    width: 100%; background: transparent; color: #ff3333; border: 1px solid #ff3333; 
    padding: 12px; font-family: inherit; cursor: pointer; text-transform: uppercase; font-weight: bold;
    transition: all 0.3s;
  }
  .btn-copy-api:hover { background: #ff3333; color: #000; box-shadow: 0 0 15px #ff3333; }

  @media (max-width: 600px) {
    .api-inputs { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>/// GÖZLERİN SİSTEMİ ///</h1>
  </div>

  <!-- SORGU MENÜSÜ -->
  <div id="tab-sorgu" class="tab-content active">
    <div class="query-box">
      <label>Sorgu Tipi Seç</label>
      <select id="queryEndpoint"></select>
      <div id="queryFields"></div>
      <button class="btn-query" id="btnSorgula" onclick="doQuery()">SORGULA</button>
    </div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <!-- API KATALOĞU -->
  <div id="tab-api" class="tab-content">
    <div id="apiList"></div>
  </div>
</div>

<!-- ALT MENÜ -->
<div class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('sorgu')" id="btn-sorgu">
    <span class="nav-icon">🔍</span> Sorgu Menüsü
  </button>
  <button class="nav-btn" onclick="switchTab('api')" id="btn-api">
    <span class="nav-icon">🔗</span> API Kataloğu
  </button>
</div>

<script>
// TÜM API TANIMLARI (Discord Nick kaldırıldı, Token ve ID gelişmiş halde)
const API_DEFS = {
  log:           { title: 'URL Log Çekme', params: [{k: 'url', l: 'Log URL', ph: 'https://...'}] },
  adsoyad:       { title: 'Ad Soyad Sorgu', params: [{k: 'ad', l: 'Ad', ph: 'Ahmet'}, {k: 'soyad', l: 'Soyad', ph: 'Yılmaz'}, {k: 'il', l: 'İl (Opsiyonel)', ph: 'Ankara'}, {k: 'ilce', l: 'İlçe (Opsiyonel)', ph: 'Çankaya'}] },
  adililce:      { title: 'Ad İl İlçe Sorgu', params: [{k: 'ad', l: 'Ad', ph: 'Ahmet'}, {k: 'il', l: 'İl', ph: 'Ankara'}, {k: 'ilce', l: 'İlçe', ph: 'Çankaya'}] },
  tc:            { title: 'TC Kimlik Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  tcgsm:         { title: 'TC -> GSM Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  gsmtc:         { title: 'GSM -> TC Sorgu', params: [{k: 'gsm', l: 'GSM No', ph: '5xx...'}] },
  ailepro:       { title: 'Aile Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  vesika:        { title: 'Vesika Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  isyeri:        { title: 'İş Yeri Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  sgk:           { title: 'SGK Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  adres:         { title: 'Adres Sorgu', params: [{k: 'tc', l: 'TC Kimlik No', ph: '11 haneli TC'}] },
  
  // TIKTOK
  tiktok_user:   { title: 'TikTok Kullanıcı Sorgu', params: [{k: 'username', l: 'Kullanıcı Adı', ph: 'd9wqq'}] },
  tiktok_id:     { title: 'TikTok ID ile Sorgu', params: [{k: 'user_id', l: 'TikTok ID', ph: '75869304178408169'}] },
  
  // DISCORD (Gelişmiş)
  discord_id:    { title: 'Discord ID Sorgu', params: [{k: 'id', l: 'Discord ID', ph: '123456789012345678'}] },
  discord_token: { title: 'Discord Token Çözücü', params: [{k: 'token', l: 'Token', ph: 'MTA...'}] },
  
  // INSTAGRAM
  instagram:     { title: 'Instagram Sorgu', params: [{k: 'username', l: 'Kullanıcı Adı', ph: 'cristiano'}] }
};

const domain = window.location.origin;

// NÜFUS API'LERİ İÇİN ALAN EŞLEŞTİRMESİ
const FIELD_MAP = {
  YAKINLIK: 'YAKINLIK DURUMU', TC: 'TC', ADI: 'ADI', SOYADI: 'SOYADI', GSM: 'GSM',
  BABAADI: 'BABA ADI', BABATC: 'BABA TC', ANNEADI: 'ANNE ADI', ANNETC: 'ANNE TC',
  DOGUMTARIHI: 'DOĞUM TARİHİ', OLUMTARIHI: 'ÖLÜM TARİHİ', DOGUMYERI: 'DOĞUM YERİ',
  NUFUSIL: 'NUFUS İL', NUFUSILCE: 'NUFUS İLÇE', MEMLEKETIL: 'MEMLEKET İL', MEMLEKETILCE: 'MEMLEKET İLÇE', MEMLEKETKOY: 'MEMLEKET KÖY',
  ADRESIL: 'ADRES İL', ADRESILCE: 'ADRES İLÇE', AILESIRANO: 'AİLE SIRA NO',
  BIREYSIRANO: 'BİREY SIRA NO', MEDENIHAL: 'MEDENİ HAL', CINSIYET: 'CİNSİYET', UYRUK: 'UYRUK',
};

// --- SEKME GEÇİŞİ ---
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('btn-' + tab).classList.add('active');
}

// --- SORGU MANTIĞI ---
const queryEndpoint = document.getElementById('queryEndpoint');
const queryFields = document.getElementById('queryFields');
const resultBox = document.getElementById('resultBox');
const btnSorgula = document.getElementById('btnSorgula');

for (const [key, def] of Object.entries(API_DEFS)) {
  let opt = document.createElement('option');
  opt.value = key;
  opt.innerText = def.title;
  queryEndpoint.appendChild(opt);
}

function renderQueryFields() {
  queryFields.innerHTML = '';
  let def = API_DEFS[queryEndpoint.value];
  def.params.forEach(p => {
    queryFields.innerHTML += `<div class="input-group"><label>${p.l}</label><input type="text" id="q_${p.k}" placeholder="${p.ph}"></div>`;
  });
  resultBox.classList.remove('show');
}
queryEndpoint.addEventListener('change', renderQueryFields);
renderQueryFields();

async function doQuery() {
  let def = API_DEFS[queryEndpoint.value];
  let params = new URLSearchParams();
  for (let p of def.params) {
    let val = document.getElementById(`q_${p.k}`).value.trim();
    if (val) params.set(p.k, val);
  }
  
  if (params.toString() === '') { alert("Lütfen en az bir alan doldurun!"); return; }

  resultBox.innerHTML = "Sorgulanıyor...";
  resultBox.classList.add('show');
  btnSorgula.disabled = true;
  btnSorgula.innerText = "BEKLENİYOR...";

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 saniye zaman aşımı

    let res = await fetch(`/api/${queryEndpoint.value}?${params.toString()}`, { signal: controller.signal });
    clearTimeout(timeoutId);

    let text = await res.text(); 
    let data;
    
    try { 
      data = JSON.parse(text); 
    } catch (err) { 
      throw new Error("API JSON yerine geçersiz bir yanıt döndürdü. (Sunucu çökmüş olabilir)"); 
    }

    renderResult(data, queryEndpoint.value);
    
  } catch (e) {
    let msg = e.name === 'AbortError' ? 'Zaman aşımı (Sunucu yanıt vermiyor)' : e.message;
    resultBox.innerHTML = `<span class="res-err">Hata: ${msg}</span>`;
  } finally {
    btnSorgula.disabled = false;
    btnSorgula.innerText = "SORGULA";
  }
}

// SONUÇLARI EKRANA BASMA
function renderResult(data, endpoint) {
  
  // EĞER HATA DÖNDÜYSE
  if (data.success === false && data.error) {
    resultBox.innerHTML = `<span class="res-err">Hata: ${data.error}</span>`;
    return;
  }

  // TIKTOK, DISCORD, INSTAGRAM (STANDART data.data DÖNER)
  if (data.success && data.data) {
    let d = data.data;
    let title = "Gözlerin";
    if(endpoint.includes('tiktok')) title = "Gözlerin Tiktok";
    else if(endpoint.includes('discord')) title = "Gözlerin Discord";
    else if(endpoint.includes('instagram')) title = "Gözlerin Instagram";

    let html = `<span class="res-title">╭━━━━━━━ ${title} ━━━━━━━</span>\n`;
    
    for (const [k, v] of Object.entries(d)) {
      if (v !== undefined && v !== null && v !== '') {
        html += `┃➥ <span class="res-key">${k}:</span> <span class="res-val">${esc(String(v))}</span>\n`;
      }
    }
    html += `<span class="res-title">╰━━━━━━━ ${title} ━━━━━━━</span>`;
    resultBox.innerHTML = html;
    return;
  }

  // NÜFUS / DİĞER API SONUÇLARI (data.veri DÖNER)
  let records = [];
  if (Array.isArray(data.veri)) records = data.veri;
  else if (data.veri && typeof data.veri === 'object') records = [data.veri];
  else if (typeof data === 'object' && data !== null) records = [data];

  records = records.filter(r => r && typeof r === 'object');

  if (!records.length) { 
    resultBox.innerHTML = '<span class="res-err">Sonuç bulunamadı veya veri boş döndü.</span>'; 
    return; 
  }

  let html = '';
  records.forEach((rec, idx) => {
    if (idx > 0) html += '\n';
    html += `<span class="res-title">╭━━━━━━━ Gözlerin ━━━━━━━</span>\n`;
    
    let hasData = false;
    for (const [k, label] of Object.entries(FIELD_MAP)) {
      if (rec[k] !== undefined && rec[k] !== null && rec[k] !== '') {
        html += `┃➥ <span class="res-key">${label}:</span> <span class="res-val">${esc(String(rec[k]))}</span>\n`;
        hasData = true;
      }
    }
    for (const [k, v] of Object.entries(rec)) {
      if (!FIELD_MAP[k] && v !== undefined && v !== null && v !== '' && k !== 'auth' && k !== 'auth_alt' && typeof v !== 'object') {
        html += `┃➥ <span class="res-key">${k}:</span> <span class="res-val">${esc(String(v))}</span>\n`;
        hasData = true;
      }
    }
    
    if (!hasData) {
        html += `┃➥ <span class="res-val">${JSON.stringify(rec).substring(0, 100)}...</span>\n`;
    }
    html += `<span class="res-title">╰━━━━━━━ Gözlerin ━━━━━━━</span>`;
  });
  
  resultBox.innerHTML = html;
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }


// --- API KATALOĞU MANTIĞI ---
const apiListEl = document.getElementById('apiList');

for (const [key, def] of Object.entries(API_DEFS)) {
  const card = document.createElement('div');
  card.className = 'api-card';
  
  let inputsHtml = '';
  def.params.forEach(p => {
    inputsHtml += `<input type="text" id="api_${key}_${p.k}" placeholder="${p.l}">`;
  });

  card.innerHTML = `
    <h2>${def.title}</h2>
    <div class="api-inputs" id="api_inputs_${key}">${inputsHtml}</div>
    <button class="btn-copy-api" onclick="copyApiLink('${key}', this)">LİNKİ KOPYALA</button>
  `;
  apiListEl.appendChild(card);
}

function copyApiLink(key, btn) {
  let def = API_DEFS[key];
  let queryParts = [];
  for (let p of def.params) {
    let val = document.getElementById(`api_${key}_${p.k}`).value.trim();
    if (val) queryParts.push(`${p.k}=${encodeURIComponent(val)}`);
  }
  if (queryParts.length === 0) { queryParts = def.params.map(p => `${p.k}=DEGER`); }

  const finalUrl = `${domain}/api/${key}?${queryParts.join('&')}`;
  
  navigator.clipboard.writeText(finalUrl).then(() => {
    btn.innerText = "KOPYALANDI ✔";
    btn.style.background = "#00ff88";
    btn.style.color = "#000";
    setTimeout(() => {
      btn.innerText = "LİNKİ KOPYALA";
      btn.style.background = "transparent";
      btn.style.color = "#ff3333";
    }, 2000);
  }).catch(err => alert("Kopyalama başarısız!"));
}
</script>
</body>
</html>
