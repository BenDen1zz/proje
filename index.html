<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Sorgu Paneli</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Share Tech Mono', monospace;
    background-color: #050000;
    background-image: 
      linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 0, 0, 0.05) 1px, transparent 1px);
    background-size: 30px 30px;
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  .container { max-width: 800px; width: 100%; padding-bottom: 50px; }
  
  .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 20px; }
  .header h1 { color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.5); font-size: 24px; letter-spacing: 2px; }

  .api-card {
    background: rgba(10, 0, 0, 0.8);
    border: 1px solid rgba(255, 0, 0, 0.3);
    border-left: 5px solid #ff0000;
    padding: 20px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
  }
  .api-card:hover {
    box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
    background: rgba(20, 0, 0, 0.9);
  }

  .api-info h2 { font-size: 18px; margin-bottom: 8px; color: #fff; }
  .api-info .code-snippet {
    display: inline-block;
    background: rgba(255, 0, 0, 0.1);
    color: #ff5555;
    padding: 5px 10px;
    font-size: 12px;
    border: 1px solid rgba(255, 0, 0, 0.3);
    border-radius: 4px;
    word-break: break-all;
  }

  .btn-start {
    background: transparent;
    color: #ff3333;
    border: 1px solid #ff3333;
    padding: 10px 25px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .btn-start:hover {
    background: #ff3333;
    color: #000;
    box-shadow: 0 0 15px #ff3333;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px);
    display: none; justify-content: center; align-items: center; z-index: 1000;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #0a0000; border: 1px solid #ff3333;
    width: 90%; max-width: 500px; padding: 25px;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
    position: relative;
  }
  .modal h3 { color: #ff3333; margin-bottom: 20px; border-bottom: 1px solid rgba(255,0,0,0.3); padding-bottom: 10px; }
  
  .input-group { margin-bottom: 15px; }
  .input-group label { display: block; color: #ff5555; font-size: 12px; margin-bottom: 5px; }
  .input-group input {
    width: 100%; padding: 10px; background: rgba(255, 0, 0, 0.05);
    border: 1px solid rgba(255, 0, 0, 0.3); color: #fff;
    font-family: inherit; outline: none;
  }
  .input-group input:focus { border-color: #ff0000; background: rgba(255, 0, 0, 0.1); }
  
  .generated-url {
    background: #000; border: 1px dashed #ff3333; padding: 15px;
    margin: 20px 0; color: #00ff88; font-size: 13px; word-break: break-all;
    display: none;
  }
  .generated-url.show { display: block; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions button {
    flex: 1; padding: 12px; font-family: inherit; cursor: pointer; border: none; font-weight: bold;
  }
  .btn-generate { background: #ff3333; color: #fff; }
  .btn-generate:hover { background: #ff0000; box-shadow: 0 0 10px #ff0000; }
  .btn-copy { background: transparent; color: #00ff88; border: 1px solid #00ff88; }
  .btn-copy:hover { background: rgba(0, 255, 136, 0.1); }
  .btn-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #ff3333; font-size: 20px; cursor: pointer; }

  @media (max-width: 600px) {
    .api-card { flex-direction: column; align-items: flex-start; gap: 15px; }
    .btn-start { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>/// API SİSTEMİ ///</h1>
  </div>
  <div id="apiList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="btn-close" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Sorgu</h3>
    <div id="modalInputs"></div>
    
    <div class="generated-url" id="generatedUrl"></div>
    
    <div class="modal-actions">
      <button class="btn-generate" onclick="generateUrl()">LİNKİ OLUŞTUR</button>
      <button class="btn-copy" id="copyBtn" onclick="copyUrl()" style="display:none;">KOPYALA</button>
    </div>
  </div>
</div>

<script>
const API_DEFINITIONS = [
  { id: 'log', title: 'URL Log Çekme', path: 'log.php?url=', params: [{ key: 'url', label: 'Log Çekilecek URL', ph: 'https://...' }] },
  { id: 'adsoyad', title: 'Ad Soyad Sorgu', path: 'adsoyad.php?ad=&soyad=', params: [{ key: 'ad', label: 'Ad', ph: 'Ahmet' }, { key: 'soyad', label: 'Soyad', ph: 'Yılmaz' }], optional: ['il', 'ilce'] },
  { id: 'adililce', title: 'Ad İl İlçe Sorgu', path: 'adililce.php?ad=&il=&ilce=', params: [{ key: 'ad', label: 'Ad', ph: 'Ahmet' }, { key: 'il', label: 'İl', ph: 'Ankara' }, { key: 'ilce', label: 'İlçe', ph: 'Çankaya' }] },
  { id: 'tc', title: 'TC Kimlik Sorgu', path: 'tc.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'tcgsm', title: 'TC -> GSM Sorgu', path: 'tcgsm.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'gsmtc', title: 'GSM -> TC Sorgu', path: 'gsmtc.php?gsm=', params: [{ key: 'gsm', label: 'GSM No', ph: '5xx xxx xx xx' }] },
  { id: 'ailepro', title: 'Aile Sorgu', path: 'ailepro.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'vesika', title: 'Vesika Sorgu', path: 'vesika.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'isyeri', title: 'İş Yeri Sorgu', path: 'isyeri.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'sgk', title: 'SGK Sorgu', path: 'sgk.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] },
  { id: 'adres', title: 'Adres Sorgu', path: 'adres.php?tc=', params: [{ key: 'tc', label: 'TC Kimlik No', ph: '11 haneli TC' }] }
];

const domain = window.location.origin;
const apiListEl = document.getElementById('apiList');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalInputs = document.getElementById('modalInputs');
const generatedUrlEl = document.getElementById('generatedUrl');
const copyBtn = document.getElementById('copyBtn');

let currentApi = null;

// Listeyi Ekrana Bas
API_DEFINITIONS.forEach(api => {
  const card = document.createElement('div');
  card.className = 'api-card';
  card.innerHTML = `
    <div class="api-info">
      <h2>${api.title}</h2>
      <div class="code-snippet">/api/${api.id}?${api.params.map(p => p.key + '=...').join('&')}</div>
    </div>
    <button class="btn-start" onclick="openModal('${api.id}')">BAŞLAT</button>
  `;
  apiListEl.appendChild(card);
});

function openModal(id) {
  currentApi = API_DEFINITIONS.find(a => a.id === id);
  modalTitle.innerText = currentApi.title;
  modalInputs.innerHTML = '';
  generatedUrlEl.classList.remove('show');
  copyBtn.style.display = 'none';

  currentApi.params.forEach(p => {
    modalInputs.innerHTML += `
      <div class="input-group">
        <label>${p.label}</label>
        <input type="text" id="inp_${p.key}" placeholder="${p.ph}">
      </div>
    `;
  });

  modal.classList.add('active');
}

function closeModal() {
  modal.classList.remove('active');
}

function generateUrl() {
  if (!currentApi) return;
  
  let queryParts = [];
  for (let p of currentApi.params) {
    let val = document.getElementById(`inp_${p.key}`).value.trim();
    if (val) {
      queryParts.push(`${p.key}=${encodeURIComponent(val)}`);
    }
  }

  if (queryParts.length === 0) {
    alert("Lütfen en az bir alan doldurun!");
    return;
  }

  const finalUrl = `${domain}/api/${currentApi.id}?${queryParts.join('&')}`;
  
  generatedUrlEl.innerText = finalUrl;
  generatedUrlEl.classList.add('show');
  copyBtn.style.display = 'block';
}

function copyUrl() {
  const text = generatedUrlEl.innerText;
  navigator.clipboard.writeText(text).then(() => {
    copyBtn.innerText = "KOPYALANDI ✔";
    setTimeout(() => copyBtn.innerText = "KOPYALA", 2000);
  });
}
</script>
</body>
</html>
